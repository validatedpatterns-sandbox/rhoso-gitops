---
clusterGroup:
  name: standalone
  namespaces:
    openstack-operators:
      # The openstack-operator CSV only supports AllNamespaces install
      # mode. An empty list omits spec.targetNamespaces from the
      # OperatorGroup, which OLM treats as AllNamespaces.
      targetNamespaces: []
    openstack:
  argoProjects:
    - rhoso-gitops-standalone
  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'
  applications:
    rhoso-gitops:
      name: rhoso-gitops
      namespace: rhoso-gitops-standalone
      argoProject: rhoso-gitops-standalone
      path: charts/all/rhoso-gitops
      extraValueFiles:
        - /overrides/values-rhoso-gitops.yaml
      ignoreDifferences:
        - group: argoproj.io
          kind: Application
          jsonPointers:
            - /metadata/finalizers
