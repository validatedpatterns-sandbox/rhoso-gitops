---
# Installs the ORC Custom Resource Definitions from the official ORC Helm
# chart published on quay.io.
#
# This Application is created by the "k-orc" application rendered by the
# rhoso-gitops chart (see charts/all/rhoso-gitops/values.yaml). It must run
# before the controller (k-orc-operator.yaml) and before any ORC custom
# resources are applied.
#
# Pruning is intentionally disabled: CRDs are cluster-scoped and deleting
# them would delete every ORC custom resource in the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k-orc-crds
  # The namespace must match the Argo CD instance watching Applications.
  namespace: vp-gitops
  labels:
    # Identifies applications owned by CI features. The pattern inventory
    # test excludes applications with this label.
    validatedpatterns.io/ci-feature: k-orc
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/background
spec:
  project: default
  source:
    # Helm OCI chart: <registry>/<chart path> is split between repoURL/chart.
    repoURL: quay.io
    chart: orc/helm/orc-crds
    # Keep in sync with k-orc-operator.yaml. Both charts must use the same
    # released version.
    targetRevision: 3.0.0-pre1
  destination:
    server: https://kubernetes.default.svc
    namespace: orc-system
  syncPolicy:
    automated: {}
    retry:
      limit: 20
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - Prune=false
      - CreateNamespace=true
