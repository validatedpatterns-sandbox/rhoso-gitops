---
# Assembles the ORC credential Secret (orc-cloud-config) for the RHOSO cloud.
#
# ORC requires a Secret with a "clouds.yaml" data key (and optionally
# "cacert"). RHOSO exposes the cloud definition without the password in the
# openstack-config ConfigMap, and the password only in the cloudrc key of the
# openstack-config-secret Secret. This Job merges both in memory and writes
# the result as the orc-cloud-config Secret used by all ORC custom resources.
#
# The password is never printed, logged, or committed.
#
# Notes:
# - The Job is a tracked Argo resource. If this manifest changes, delete the
#   completed Job object first (Jobs are immutable), Argo will then re-create
#   and re-run it.
# - If the RHOSO admin password is rotated, delete the completed Job so that
#   the next sync re-runs it and refreshes the Secret.
#
# Applied by the "k-orc" Argo CD application, sync wave -1 (after the RBAC,
# before the ORC custom resources).
apiVersion: batch/v1
kind: Job
metadata:
  name: k-orc-credentials
  namespace: openstack
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k-orc-credentials
    spec:
      restartPolicy: Never
      serviceAccountName: k-orc-credentials
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-credentials
          # Same image as the pattern utility container: provides oc and yq.
          image: quay.io/validatedpatterns/utility-container:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            privileged: false
            # No fixed runAsUser: OpenShift restricted-v2 SCCs assign a UID
            # from the namespace's allocated range (the pod keeps
            # runAsNonRoot).
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          env:
            - name: WORK_DIR
              value: /work
            # Keep tooling state (oc cache, etc.) on the emptyDir.
            - name: HOME
              value: /work
          command: [/bin/bash, -c]
          args:
            - |
              set -euo pipefail

              OC="oc --server=https://kubernetes.default.svc \
                --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"

              clouds="$WORK_DIR/clouds.yaml"
              cloudrc="$WORK_DIR/cloudrc"
              cacert="$WORK_DIR/cacert"

              $OC get -n openstack configmap openstack-config -o jsonpath='{.data.clouds\.yaml}' > "$clouds"
              $OC get -n openstack secret openstack-config-secret -o jsonpath='{.data.cloudrc}' | base64 -d > "$cloudrc"
              # Secret data is base64-encoded in jsonpath output: decode it.
              $OC get -n openstack secret combined-ca-bundle -o jsonpath='{.data.tls-ca-bundle\.pem}' | base64 -d > "$cacert"

              # Extract OS_PASSWORD from the cloudrc shell exports. The value
              # is only ever passed through the environment; it is not echoed.
              password="$(sed -n 's/^export OS_PASSWORD=//p' "$cloudrc" | tr -d '"'"'"'')"
              if [ -z "$password" ]; then
                echo "OS_PASSWORD not found in openstack-config-secret cloudrc" >&2
                exit 1
              fi

              # Inject the password into the cloud entry. The cloud name and
              # the non-secret auth fields come from the ConfigMap.
              cloud_name="$($OC get -n openstack configmap openstack-config -o jsonpath='{.data.OS_CLOUD}' | tr -d '[:space:]')"
              if [ -z "$cloud_name" ]; then
                cloud_name="default"
              fi
              PASSWORD="$password" yq -i ".clouds.\"$cloud_name\".auth.password = strenv(PASSWORD)" "$clouds"

              test -s "$cacert"

              # Server-side apply: the plain client-side apply would store
              # the full (base64) secret content in the
              # last-applied-configuration annotation, which exceeds the
              # 256kB annotation size limit for the ~230kB CA bundle.
              $OC create secret generic orc-cloud-config -n openstack \
                --from-file=clouds.yaml="$clouds" \
                --from-file=cacert="$cacert" \
                --dry-run=client -o yaml | $OC apply --server-side -f -

              echo "Secret orc-cloud-config ensured (cloud: $cloud_name)"
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
