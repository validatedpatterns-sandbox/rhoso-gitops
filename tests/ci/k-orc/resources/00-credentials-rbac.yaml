---
# RBAC for the k-orc credentials Job. The Job reads the RHOSO
# openstack-config ConfigMap (clouds.yaml without the password), the
# openstack-config-secret Secret (cloudrc, which carries OS_PASSWORD) and the
# combined-ca-bundle Secret (CA bundle), and writes the assembled ORC
# credential Secret orc-cloud-config.
#
# Applied by the "k-orc" Argo CD application, sync wave -2 (before the
# credentials Job).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k-orc-credentials
  namespace: openstack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k-orc-credentials
  namespace: openstack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [openstack-config]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [openstack-config-secret, combined-ca-bundle]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [orc-cloud-config]
    verbs: [get, patch, update]
  # Create cannot be restricted by resourceName; the service account is
  # dedicated to this Job and can only create secrets in this namespace.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k-orc-credentials
  namespace: openstack
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k-orc-credentials
subjects:
  - kind: ServiceAccount
    name: k-orc-credentials
    namespace: openstack
